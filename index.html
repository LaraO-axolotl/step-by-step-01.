<title>Step by Step</title>
<style>
:root{--bg:#eef3f4;--card:#fff;--ink:#1d2b33;--mute:#5a6b74;--line:#cfdadd;--accent:#0f6e6e;--accent-ink:#fff;--warm:#b4730f;--soft:#dcecec;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12191d;--card:#1b252b;--ink:#e6eef0;--mute:#9db0b8;--line:#2f3f47;--accent:#4fb7b0;--accent-ink:#0a1416;--warm:#e0a64a;--soft:#223338}}
:root[data-theme="dark"]{--bg:#12191d;--card:#1b252b;--ink:#e6eef0;--mute:#9db0b8;--line:#2f3f47;--accent:#4fb7b0;--accent-ink:#0a1416;--warm:#e0a64a;--soft:#223338}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 18px 60px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
h1{font:600 28px/1.2 Georgia,"Times New Roman",serif;margin:8px 0 4px}
h2{font:600 22px/1.3 Georgia,"Times New Roman",serif;margin:0 0 6px}
p{margin:0 0 12px}.mute{color:var(--mute);font-size:15px}
select{font:inherit;font-size:14px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 8px;margin-top:10px}
.notice{background:var(--soft);border-radius:10px;padding:10px 14px;font-size:14px;color:var(--mute);margin:14px 0}
.notice a{color:var(--accent)}
.track{display:flex;gap:6px;margin:18px 0 6px}
.track button{flex:1;border:0;border-top:4px solid var(--line);background:none;color:var(--mute);padding:8px 0 0;font:inherit;font-size:13px;cursor:pointer;text-align:start}
.track button.done{border-color:var(--accent);color:var(--ink)}
.track button.cur{border-color:var(--warm);color:var(--ink);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 20px;margin-top:10px}
label{display:block;font-weight:600;margin:16px 0 6px}
textarea,input[type=text],input[type=date]{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{min-height:90px;resize:vertical}
:focus-visible{outline:3px solid var(--warm);outline-offset:2px}
input[type=range]{width:100%;accent-color:var(--accent)}
.row{display:flex;gap:8px;align-items:center;margin-bottom:8px}.row input[type=text]{flex:1;min-width:0}
.btn{font:inherit;font-weight:600;border-radius:10px;padding:11px 18px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer}
.btn.ghost{background:none;color:var(--accent)}.btn.sm{padding:6px 12px;font-size:14px}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:22px;flex-wrap:wrap}
.opt{display:block;width:100%;text-align:start;font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.opt.sel{border-color:var(--accent);background:var(--soft)}
.tip{border-inline-start:4px solid var(--warm);padding:2px 12px;margin:14px 0;color:var(--mute);font-size:15px}
.big{font:600 40px/1 Georgia,serif;color:var(--accent)}
.sum dt{font-weight:600;margin-top:12px}.sum dd{margin:2px 0 0;color:var(--mute)}
footer{margin-top:28px;font-size:13px;color:var(--mute)}
@media print{.track,.nav,.notice,footer,select{display:none}body{background:#fff;color:#000}.card{border:0}}
</style>
</head>

try{const l=localStorage.getItem("sbsl")||(navigator.language||"en").slice(0,2);if(T[l])L=l}catch(e){}
const t=k=>T[L][k];
function load(){try{const r=localStorage.getItem("sbs");if(r)return Object.assign({},blank,JSON.parse(r))}catch(e){}return JSON.parse(JSON.stringify(blank))}
function save(){try{localStorage.setItem("sbs",JSON.stringify(S))}catch(e){}}
function setLang(l){L=l;try{localStorage.setItem("sbsl",l)}catch(e){}render()}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const filled=()=>S.ideas.map((x,i)=>({t:x.trim(),i})).filter(x=>x.t);
function go(n){S.step=Math.max(0,Math.min(4,n));save();render();window.scrollTo(0,0)}
function set(k,v){S[k]=v;save()}
function pp(i,k,v){S.pros[i]=Object.assign({g:"",b:""},S.pros[i]);S.pros[i][k]=v;save()}
function nav(ok,nx){return `<div class="nav">${S.step>0?`<button class="btn ghost" onclick="go(S.step-1)">${t("bk")}</button>`:"<span></span>"}${S.step<4?`<button class="btn" id="nx" ${ok?"":"disabled style='opacity:.45'"} onclick="go(S.step+1)">${nx}</button>`:""}</div>`}
function ok0(){const b=document.getElementById("nx"),o=S.problem.trim();b.disabled=!o;b.style.opacity=o?1:.45}
function delta(){const d=S.before-S.after;return d>0?"−"+d:d<0?"+"+(-d):"0"}
function upd4(){document.getElementById("av").textContent=S.after;document.getElementById("dl").textContent=delta()}
function render(){
document.documentElement.lang=L;document.documentElement.dir=L=="ar"?"rtl":"ltr";document.getElementById("lang").value=L;
["ttl","sub","note","find","loc","ft"].forEach(k=>document.getElementById(k).textContent=t(k));
document.title=t("ttl");
document.getElementById("track").innerHTML=t("steps").map((s,i)=>`<button class="${i<S.step?"done":i==S.step?"cur":""}" aria-current="${i==S.step}" onclick="go(${i})">${s}</button>`).join("");
let h="";const c=document.getElementById("card");
if(S.step==0)h=`<h2>${t("h0")}</h2><p class="mute">${t("i0")}</p>
<label for="p">${t("lp")}</label><input id="p" type="text" value="${esc(S.problem)}" oninput="set('problem',this.value);ok0()">
<label for="d">${t("ld")}</label><textarea id="d" oninput="set('detail',this.value)">${esc(S.detail)}</textarea>
<label for="b">${t("lb")} <b id="bv">${S.before}</b>/10</label><input id="b" type="range" min="0" max="10" value="${S.before}" oninput="set('before',+this.value);bv.textContent=this.value">
<div class="tip">${t("t0")}</div>${nav(S.problem.trim(),t("n0"))}`;
if(S.step==1)h=`<h2>${t("h1")}</h2><p class="mute">${t("i1")}</p>${S.ideas.map((x,i)=>`<div class="row"><input type="text" aria-label="${t("id")} ${i+1}" placeholder="${t("id")} ${i+1}" value="${esc(x)}" oninput="S.ideas[${i}]=this.value;save()"></div>`).join("")}
<button class="btn ghost sm" onclick="S.ideas.push('');save();render()">${t("add")}</button><div class="tip">${t("t1")}</div>${nav(filled().length>=2,t("n1"))}`;
if(S.step==2){const f=filled();h=`<h2>${t("h2")}</h2><p class="mute">${t("i2")}</p>`+f.map(x=>{const p=S.pros[x.i]||{g:"",b:""};return `<div style="margin-bottom:16px"><button class="opt ${S.chosen==x.i?"sel":""}" onclick="S.chosen=${x.i};save();render()" aria-pressed="${S.chosen==x.i}"><b>${esc(x.t)}</b>${S.chosen==x.i?" ("+t("chosen")+")":""}</button><div class="row"><input type="text" aria-label="${t("good")}" placeholder="${t("good")}" value="${esc(p.g)}" oninput="pp(${x.i},'g',this.value)"><input type="text" aria-label="${t("bad")}" placeholder="${t("bad")}" value="${esc(p.b)}" oninput="pp(${x.i},'b',this.value)"></div></div>`}).join("")+nav(S.chosen>=0&&(S.ideas[S.chosen]||"").trim(),t("n2"))}
if(S.step==3)h=`<h2>${t("h3")}</h2><p class="mute">${t("ci")}: <b>${esc(S.ideas[S.chosen]||"")}</b><br>${t("i3")}</p>`+S.plan.map((s,i)=>`<div class="row"><input type="text" aria-label="${t("st")} ${i+1}" placeholder="${t("st")} ${i+1}" value="${esc(s.t)}" oninput="S.plan[${i}].t=this.value;save()"><input type="date" aria-label="${t("dt")} ${i+1}" style="max-width:150px" value="${esc(s.d)}" onchange="S.plan[${i}].d=this.value;save()"></div>`).join("")+`<button class="btn ghost sm" onclick="S.plan.push({t:'',d:''});save();render()">${t("adds")}</button><div class="tip">${t("t3")}</div>${nav(S.plan.some(s=>s.t.trim()),t("n3"))}`;
if(S.step==4)h=`<h2>${t("h4")}</h2><p class="mute">${t("i4")}</p>
<label for="a">${t("la")} <b id="av">${S.after}</b>/10</label><input id="a" type="range" min="0" max="10" value="${S.after}" oninput="set('after',+this.value);upd4()">
<p style="margin-top:14px"><span class="big" id="dl" dir="ltr">${delta()}</span> <span class="mute">${t("ch")}</span></p>
<label for="l">${t("ll")}</label><textarea id="l" oninput="set('learned',this.value)">${esc(S.learned)}</textarea>
<dl class="sum"><dt>${t("pr")}</dt><dd>${esc(S.problem)}</dd><dt>${t("so")}</dt><dd>${esc(S.ideas[S.chosen]||"")}</dd><dt>${t("sp")}</dt><dd>${S.plan.filter(s=>s.t.trim()).map(s=>esc(s.t)+(s.d?" ("+esc(s.d)+")":"")).join("<br>")}</dd></dl>
<div class="nav"><button class="btn ghost" onclick="go(3)">${t("bk")}</button><span><button class="btn ghost" onclick="window.print()">${t("prt")}</button> <button class="btn" onclick="if(confirm(t('cf'))){S=JSON.parse(JSON.stringify(blank));save();render()}">${t("nw")}</button></span></div>`;
c.innerHTML=h}
render();
</script>
</body>
</html>
